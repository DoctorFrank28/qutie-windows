[project]
name = "qutie"
version = "1.2.0"
description = "Windows printer driver and tools for the HPRT Qutie Bluetooth label maker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pillow>=10",
    "pystray>=0.19",
    "python-barcode>=0.16.1",
    "pywebview>=5",
    "segno>=1.6.6",
    "uharfbuzz>=0.40",
    "winrt-runtime>=2",
    "winrt-windows-devices-bluetooth>=2",
    "winrt-windows-devices-enumeration>=2",
    "winrt-windows-foundation>=2",
    "winrt-windows-foundation-collections>=2",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
qutie = "qutie.cli:main"

[project.gui-scripts]
qutie-app = "qutie.app.main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qutie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
