name: Release

# Push a tag like v1.2.0 (the same version as pyproject.toml): the tests run, then
# Qutie-Setup.exe is built and attached to the GitHub release of that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run pytest
      - name: Check that the tag is the app version
        shell: pwsh
        run: |
          $version = uv run python -c "import qutie; print(qutie.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }
      - run: uv run pyinstaller packaging/qutie.spec --noconfirm
      - name: Attach Qutie-Setup.exe to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag "dist/Qutie-Setup.exe" --clobber }
          else { gh release create $tag "dist/Qutie-Setup.exe" --title "Qutie $tag" --generate-notes }
