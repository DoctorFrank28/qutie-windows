name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # The Studio engine tests (tests/js) run in Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run pytest -v
